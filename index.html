<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini Fun Pro</title>

<style>
body {
  font-family: Arial;
  text-align: center;
  background: #f5f5f5;
}

button {
  padding: 10px;
  margin: 5px;
  border: none;
  border-radius: 8px;
  background: black;
  color: white;
}

input {
  padding: 10px;
  margin: 5px;
}

.hidden { display: none; }

#runBtn { position: absolute; }

/* 🥇 TOP 1 EFFECT */
.top1 {
  color: gold;
  font-weight: bold;
  font-size: 20px;
  animation: glow 1s infinite alternate;
}

@keyframes glow {
  from { text-shadow: 0 0 5px gold; }
  to { text-shadow: 0 0 20px orange; }
}
</style>
</head>

<body>

<h1>Mini Fun 😈</h1>

<!-- LOGIN -->
<div id="auth">
<input id="user" placeholder="Username"><br>
<input id="pass" type="password"><br>
<button onclick="login()">Login</button>
<button onclick="register()">Register</button>
</div>

<!-- MENU -->
<div id="menu" class="hidden">
<h2 id="welcome"></h2>
<h3 id="scoreText"></h3>

<button onclick="openGame('guess')">🎯 Guess</button>
<button onclick="openGame('click')">⚡ Speed</button>
<button onclick="openGame('run')">🏃 Catch</button>
<button onclick="openGame('luck')">🧠 Luck</button>

<button onclick="showBoard()">🏆 Leaderboard</button>
<button onclick="logout()">Logout</button>
</div>

<!-- GUESS -->
<div id="guess" class="hidden">
<h2>Guess Number</h2>
<input id="guessInput" type="number">
<button onclick="checkGuess()">OK</button>
<p id="guessResult"></p>
<button onclick="back()">Back</button>
</div>

<!-- CLICK -->
<div id="click" class="hidden">
<h2>Click Fast (5s)</h2>
<button onclick="startClick()">Start</button>
<p id="clickCount"></p>
<button onclick="back()">Back</button>
</div>

<!-- RUN -->
<div id="run" class="hidden">
<h2>Catch Button 😈</h2>
<button id="runBtn">CLICK</button>
<p id="runMsg"></p>
<button onclick="back()">Back</button>
</div>

<!-- LUCK -->
<div id="luck" class="hidden">
<h2>Lucky Test</h2>
<button onclick="testLuck()">Test</button>
<p id="luckResult"></p>
<button onclick="back()">Back</button>
</div>

<!-- BOARD -->
<div id="board" class="hidden">
<h2>🏆 Leaderboard</h2>
<ul id="list"></ul>
<button onclick="back()">Back</button>
</div>

<script>
// ===== DATA =====
let users = JSON.parse(localStorage.getItem("users")||"{}");
let currentUser=null;

function save(){
  localStorage.setItem("users",JSON.stringify(users));
}

// ===== AUTH =====
function register(){
  if(users[user.value]) return alert("User exists");
  users[user.value]={pass:pass.value,score:0};
  save();
  alert("Registered!");
}

function login(){
  if(!users[user.value]||users[user.value].pass!=pass.value)
    return alert("Wrong login");

  currentUser=user.value;
  auth.classList.add("hidden");
  menu.classList.remove("hidden");

  welcome.innerText="Hello "+currentUser;
  updateScore();
}

function logout(){
  location.reload();
}

// ===== SCORE =====
function addScore(s){
  users[currentUser].score += s;
  save();
  updateScore();
}

function updateScore(){
  scoreText.innerText="Score: "+users[currentUser].score;
}

// ===== MENU =====
function openGame(g){
  menu.style.display="none";
  document.getElementById(g).style.display="block";
}

function back(){
  guess.style.display="none";
  click.style.display="none";
  run.style.display="none";
  luck.style.display="none";
  board.style.display="none";
  menu.style.display="block";
}

// ===== GUESS =====
let num=Math.floor(Math.random()*100)+1;
let tries=0;

function checkGuess(){
  let g=Number(guessInput.value);
  tries++;

  if(g==num){
    let score=Math.max(100-tries*10,10);
    guessResult.innerText="WIN +"+score;
    addScore(score);
    num=Math.floor(Math.random()*100)+1;
    tries=0;
  } else {
    guessResult.innerText=g<num?"⬆️":"⬇️";
  }
}

// ===== CLICK =====
function startClick(){
  let c=0;
  clickCount.innerText="GO!";
  document.onclick=()=>c++;

  setTimeout(()=>{
    document.onclick=null;
    clickCount.innerText="Score: "+c;
    addScore(c);
  },5000);
}

// ===== RUN =====
let btn=document.getElementById("runBtn");
btn.style.left="40%";
btn.style.top="50%";

document.addEventListener("mousemove",move);
document.addEventListener("touchstart",move);

function move(e){
  let t=e.touches?e.touches[0]:e;
  let dx=t.clientX-btn.offsetLeft;
  let dy=t.clientY-btn.offsetTop;

  if(Math.sqrt(dx*dx+dy*dy)<100){
    btn.style.left=Math.random()*300+"px";
    btn.style.top=Math.random()*500+"px";
  }
}

btn.onclick=()=>{
  runMsg.innerText="Caught +20";
  addScore(20);
};

// ===== LUCK =====
function testLuck(){
  let s=Math.floor(Math.random()*100);
  luckResult.innerText="You got "+s;
  addScore(s);
}

// ===== LEADERBOARD =====
function showBoard(){
  menu.style.display="none";
  board.style.display="block";

  list.innerHTML="";

  let arr=Object.entries(users);
  arr.sort((a,b)=>b[1].score-a[1].score);

  arr.forEach((x,i)=>{
    let li=document.createElement("li");

    if(i===0){
      li.innerText="👑 "+x[0]+" - "+x[1].score;
      li.classList.add("top1");
    } else {
      li.innerText=(i+1)+". "+x[0]+" - "+x[1].score;
    }

    list.appendChild(li);
  });
}
</script>

</body>
</html>
