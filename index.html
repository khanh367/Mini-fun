<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neal.fun Clone - Tiêu tiền</title>
    <style>
        /* PHẦN GIAO DIỆN (CSS) */
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #f1f2f6;
            margin: 0;
            padding-bottom: 50px;
        }

        .header {
            background: #ffffff;
            padding: 30px 20px;
            text-align: center;
            position: sticky;
            top: 0;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            z-index: 100;
        }

        h1 { margin: 0 0 10px 0; font-size: 24px; }

        #balance {
            font-size: 2.5rem;
            font-weight: bold;
            color: #2ecc71;
            background: #1e272e;
            display: inline-block;
            padding: 10px 30px;
            border-radius: 10px;
            min-width: 300px;
        }

        .container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            padding: 20px;
            max-width: 1100px;
            margin: 20px auto;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            transition: transform 0.2s;
        }

        .card:hover { transform: translateY(-5px); }

        .emoji { font-size: 60px; margin-bottom: 10px; }

        .card h3 { margin: 10px 0; font-size: 22px; }

        .price { color: #2ecc71; font-weight: bold; font-size: 18px; margin-bottom: 20px; }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 16px;
        }

        .buy { background-color: #2ecc71; color: white; }
        .buy:hover { background-color: #27ae60; }

        .sell { background-color: #f1f2f6; color: #333; }
        .sell.active { background-color: #e74c3c; color: white; }

        button:disabled {
            background-color: #ecf0f1;
            color: #bdc3c7;
            cursor: not-allowed;
        }

        .count {
            width: 50px;
            font-weight: bold;
            font-size: 18px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Tiêu hết 1,000,000,000$</h1>
        <div id="balance">$ 1,000,000,000</div>
    </div>

    <div class="container" id="item-grid">
        </div>

    <script>
        /* PHẦN LOGIC (JAVASCRIPT) */
        const items = [
            { name: "Ly Cà Phê", price: 5, img: "☕" },
            { name: "Vé Xem Phim", price: 15, img: "🎬" },
            { name: "Máy Chơi Game", price: 500, img: "🎮" },
            { name: "iPhone 15 Pro", price: 1000, img: "📱" },
            { name: "Mô Tô Phân Khối Lớn", price: 20000, img: "🏍️" },
            { name: "Siêu Xe Ferrari", price: 250000, img: "🏎️" },
            { name: "Du Thuyền", price: 5000000, img: "🚤" },
            { name: "Biệt Thự Biển", price: 15000000, img: "🏠" },
            { name: "Tòa Nhà Chọc Trời", price: 800000000, img: "🏢" }
        ];

        let balance = 1000000000;
        let inventory = {};

        // Khởi tạo số lượng bằng 0 cho tất cả món đồ
        items.forEach(item => inventory[item.name] = 0);

        function updateUI() {
            // Cập nhật số tiền hiển thị
            document.getElementById('balance').innerText = `$ ${balance.toLocaleString()}`;
            
            const grid = document.getElementById('item-grid');
            grid.innerHTML = '';

            items.forEach(item => {
                const count = inventory[item.name];
                const card = document.createElement('div');
                card.className = 'card';
                
                card.innerHTML = `
                    <div class="emoji">${item.img}</div>
                    <h3>${item.name}</h3>
                    <div class="price">$${item.price.toLocaleString()}</div>
                    <div class="controls">
                        <button class="sell ${count > 0 ? 'active' : ''}" 
                                onclick="sellItem('${item.name}', ${item.price})" 
                                ${count === 0 ? 'disabled' : ''}>Bán</button>
                        
                        <span class="count">${count}</span>
                        
                        <button class="buy" 
                                onclick="buyItem('${item.name}', ${item.price})" 
                                ${balance < item.price ? 'disabled' : ''}>Mua</button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        window.buyItem = (name, price) => {
            if (balance >= price) {
                balance -= price;
                inventory[name]++;
                updateUI();
            }
        };

        window.sellItem = (name, price) => {
            if (inventory[name] > 0) {
                balance += price;
                inventory[name]--;
                updateUI();
            }
        };

        // Chạy lần đầu tiên để hiện danh sách
        updateUI();
    </script>
</body>
</html>
