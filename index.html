<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini Fun Pro</title>

<style>
body {font-family: Arial; text-align:center; background:#f5f5f5;}
button {padding:10px;margin:5px;border:none;border-radius:8px;background:black;color:white;}
input {padding:10px;margin:5px;}
.hidden{display:none;}
</style>
</head>

<body>

<h1 id="title">Mini Fun 😈</h1>

<!-- LANGUAGE -->
<button onclick="setLang('vi')">VI</button>
<button onclick="setLang('en')">EN</button>

<!-- LOGIN -->
<div id="auth">
<h2 id="loginText">Đăng nhập</h2>
<input id="user" placeholder="Username"><br>
<input id="pass" type="password" placeholder="Password"><br>
<button onclick="login()">Login</button>
<button onclick="register()">Register</button>
</div>

<!-- MENU -->
<div id="menu" class="hidden">
<h2 id="welcome"></h2>
<button onclick="startGame()">🎯 Play</button>
<button onclick="showBoard()">🏆 Leaderboard</button>
<button onclick="logout()">Logout</button>
</div>

<!-- GAME -->
<div id="game" class="hidden">
<h2 id="gameText">Guess Number</h2>
<input id="guess" type="number"><br>
<button onclick="check()">OK</button>
<p id="result"></p>
<button onclick="backMenu()">⬅ Back</button>
</div>

<!-- LEADERBOARD -->
<div id="board" class="hidden">
<h2>🏆 Leaderboard</h2>
<ul id="list"></ul>
<button onclick="backMenu()">⬅ Back</button>
</div>

<script>
// ===== DATA =====
let users = JSON.parse(localStorage.getItem("users") || "{}");
let currentUser = null;

// ===== LANGUAGE =====
let lang = "en";

function setLang(l){
  lang = l;
  updateLang();
}

function updateLang(){
  loginText.innerText = lang=="vi"?"Đăng nhập":"Login";
  gameText.innerText = lang=="vi"?"Đoán số":"Guess Number";
}

// ===== AUTH =====
function register(){
  let u=user.value.trim();
  let p=pass.value.trim();

  if(!u||!p) return alert("Nhập đủ!");

  if(users[u]) return alert("User tồn tại");

  users[u]={pass:p,score:999};
  localStorage.setItem("users",JSON.stringify(users));

  alert("Đăng ký OK");
}

function login(){
  let u=user.value.trim();
  let p=pass.value.trim();

  if(!users[u]||users[u].pass!==p){
    alert("Sai tài khoản");
    return;
  }

  currentUser=u;
  auth.classList.add("hidden");
  menu.classList.remove("hidden");
  welcome.innerText="Hello "+u;
}

// ===== LOGOUT =====
function logout(){
  location.reload();
}

// ===== GAME =====
let random,tries;

function startGame(){
  menu.classList.add("hidden");
  game.classList.remove("hidden");

  random=Math.floor(Math.random()*100)+1;
  tries=0;
  result.innerText="";
}

function check(){
  let g=Number(guess.value);
  tries++;

  if(g===random){
    result.innerText="WIN 🎉 ("+tries+" tries)";

    if(tries<users[currentUser].score){
      users[currentUser].score=tries;
      localStorage.setItem("users",JSON.stringify(users));
    }
  } else if(g<random){
    result.innerText="⬆️ Bigger";
  } else {
    result.innerText="⬇️ Smaller";
  }
}

// ===== LEADERBOARD =====
function showBoard(){
  menu.classList.add("hidden");
  board.classList.remove("hidden");

  list.innerHTML="";

  let arr=Object.entries(users);
  arr.sort((a,b)=>a[1].score-b[1].score);

  arr.forEach(x=>{
    let li=document.createElement("li");
    li.innerText=x[0]+" - "+x[1].score;
    list.appendChild(li);
  });
}

// ===== BACK =====
function backMenu(){
  game.classList.add("hidden");
  board.classList.add("hidden");
  menu.classList.remove("hidden");
}
</script>

</body>
</html>
